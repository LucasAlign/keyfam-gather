services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gather
      POSTGRES_USER: gather
      POSTGRES_PASSWORD: gather_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gather_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gather -d gather"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  gather_postgres_data:
