name: Verify events-module SQL

# Validates docs/aligncore-events-module.sql against a real PostgreSQL by
# applying it (with the Align Core users/audit_log stubs it depends on) and
# running docs/aligncore-events-module.verify.sql. See
# docs/aligncore-events-module.md family for the migration design.

on:
  push:
    branches: ["**"]
    paths:
      - "docs/aligncore-events-module.sql"
      - "docs/aligncore-events-module.verify.sql"
      - "scripts/verify-events-module.sh"
      - ".github/workflows/verify-events-module.yml"
  pull_request:
    paths:
      - "docs/aligncore-events-module.sql"
      - "docs/aligncore-events-module.verify.sql"
      - "scripts/verify-events-module.sh"
      - ".github/workflows/verify-events-module.yml"
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest

    # Matches compose.yaml's postgres:17-alpine. The script runs in its
    # PGHOST mode against this service, so no local cluster is spun up.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gather
          POSTGRES_PASSWORD: gather_dev
          POSTGRES_DB: gather
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gather -d gather"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: gather
      PGPASSWORD: gather_dev

    steps:
      - uses: actions/checkout@v7

      - name: Ensure psql client is available
        run: psql --version || sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verify events-module DDL
        run: npm run verify:events-schema
