services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to managed PostgreSQL}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:?Set DEMO_USER_EMAIL}
      DEMO_AUTH_PASSWORD: ${DEMO_AUTH_PASSWORD:?Set DEMO_AUTH_PASSWORD}
      DEMO_AUTH_SECRET: ${DEMO_AUTH_SECRET:?Set DEMO_AUTH_SECRET}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
